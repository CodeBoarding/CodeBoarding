spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cloud:
    gateway:
      routes:
        - id: vets-service
          uri: lb://vets-service
          predicates:
            - Path=/api/vet/**
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
---
fallback:
  uri: configserver:http://config-server:8888
