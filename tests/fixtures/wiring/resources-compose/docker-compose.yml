services:
  api:
    build: ./api
    environment:
      # The only thing naming the cache, which is what makes the api its user.
      - CACHE_URL=redis://cache:6379

  cache:
    image: redis:7

  broker:
    image: rabbitmq:3-management

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest

  mystery:
    image: acme/mystery:1

  metrics:
    build: ./monitoring/prometheus
