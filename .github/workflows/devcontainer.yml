name: Dev Container

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - tests/test_devcontainer.py
      - infra/constants.py
      - infra/tool_registry/registry.py
      - infra/tool_registry/paths.py
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - tests/test_devcontainer.py
      - infra/constants.py
      - infra/tool_registry/registry.py
      - infra/tool_registry/paths.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          env: CODEBOARDING_DEVCONTAINER_CI=1
          runCmd: |
            set -eu
            test "$(command -v python)" = /home/vscode/.venv/bin/python
            python - <<'PY'
            import re, sys, tomllib
            with open("pyproject.toml", "rb") as f:
                requires = tomllib.load(f)["project"]["requires-python"]
            match = re.search(r">=(\d+)\.(\d+)", requires)
            assert match is not None, requires
            assert sys.version_info[:2] == (int(match.group(1)), int(match.group(2))), sys.version
            PY
            uv --version
            node --version
            mypy --version
            codeboarding --help > /dev/null
            pre-commit run --all-files
            pytest tests/test_devcontainer.py -q
            if command -v claude > /dev/null; then
              echo "::error::Heavy post-create steps ran; CODEBOARDING_DEVCONTAINER_CI did not reach post-create.sh"
              exit 1
            fi
